<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>чик-чик ссылка</title>
    <meta name="description" content="Сокращатель ссылок - быстро и просто создавайте короткие URL">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>чик-чик ссылка</h1>
            <a id="spy-link" href="#" class="spy-link">Spy Page (CORS Demo)</a>
        </header>

        <main class="main">
            <form id="shorten-form" class="form-card">
                <div class="input-group">
                    <input 
                        type="url" 
                        id="url-input" 
                        placeholder="Вставьте длинную ссылку..." 
                        required
                        autocomplete="off"
                    >
                    <button type="submit" class="btn-primary">
                        <span class="btn-text">Сократить</span>
                        <span class="btn-loader hidden"></span>
                    </button>
                </div>
            </form>

            <div id="result" class="result-card hidden">
                <div class="result-header">
                    <span class="result-icon">OK</span>
                    <span>Ссылка создана!</span>
                </div>
                <div class="result-body">
                    <div class="short-url-container">
                        <a id="short-url" href="#" target="_blank" class="short-url"></a>
                        <button id="copy-btn" class="btn-copy" title="Копировать">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                    </div>
                    <p class="original-url">
                        <span class="label">Оригинал:</span>
                        <span id="original-url"></span>
                    </p>
                </div>
            </div>

            <section class="links-section">
                <div class="section-header">
                    <h2>Ваши ссылки</h2>
                    <button id="refresh-btn" class="btn-icon" title="Обновить">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    </button>
                </div>
                <div id="links-container" class="links-container">
                    <div class="empty-state">
                        <span class="empty-icon">—</span>
                        <p>Пока нет ссылок</p>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
        </footer>
    </div>

    <div id="toast" class="toast hidden">
        <span id="toast-message"></span>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
