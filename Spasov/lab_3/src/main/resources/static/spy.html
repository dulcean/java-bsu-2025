<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Spy Admin Panel</title>
    <style>
        body { background: #0f172a; color: #38bdf8; font-family: 'Consolas', monospace; padding: 30px; }
        h1 { border-bottom: 2px solid #38bdf8; padding-bottom: 10px; text-shadow: 0 0 10px #38bdf8; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; background: #1e293b; }
        th, td { border: 1px solid #334155; padding: 15px; text-align: left; }
        th { background: #0f172a; color: #f87171; }
        tr:hover { background: #334155; }
        .waifu-thumb { width: 80px; height: 80px; object-fit: cover; border-radius: 5px; border: 1px solid #38bdf8; }
        .status { color: #4ade80; font-size: 0.8em; }
    </style>
</head>
<body>

<h1>🕵️‍♂️ INTERNAL MONITORING SYSTEM v1.0.4</h1>
<p class="status">[STATUS: ACTIVE] [DATABASE: CONNECTED]</p>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Waifu</th>
        <th>Picture</th>
    </tr>
    </thead>
    <tbody id="spyTable">
    </tbody>
</table>

<h2 style="margin-top: 50px; color: #f87171;">📊 СВОДНАЯ СТАТИСТИКА ПОПУЛЯРНОСТИ</h2>
<table>
    <thead>
    <tr>
        <th>Waifu</th>
        <th>Count</th>
    </tr>
    </thead>
    <tbody id="statsTable">
    </tbody>
</table>

<script>
    async function loadSpyData() {
        try {
            const response = await fetch('/api/spy-data');
            const data = await response.json();
            const tableBody = document.getElementById('spyTable');

            tableBody.innerHTML = data.map(item => `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.username || 'Аноним'}</td>
                    <td><strong>${item.waifuName}</strong></td>
                    <td>
                        <img src="${item.imageUrl}" class="waifu-thumb"
                             onerror="this.src='https://via.placeholder.com/80?text=No+Img'">
                    </td>
                </tr>
            `).reverse().join('');
        } catch (err) {
            console.error("Critical error in data fetch!");
        }
    }

    async function loadStatsTable() {
        const response = await fetch('/api/stats');
        const stats = await response.json();
        const tableBody = document.getElementById('statsTable');

        tableBody.innerHTML = stats.map(s => {
            return `
                <tr>
                    <td>${s.waifuName}</td>
                    <td>${s.count}</td>
                </tr>
            `;
        }).join('');
    }

    loadSpyData();
    loadStatsTable();
</script>
</body>
</html>
